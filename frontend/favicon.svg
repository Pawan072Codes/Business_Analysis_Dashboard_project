<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- 3 Analytics Bars -->
  <!-- Bar 1: Blue -->
  <rect x="11" y="32" width="10" height="20" rx="3" fill="url(#bar1)"/>
  <!-- Bar 2: Indigo -->
  <rect x="27" y="22" width="10" height="30" rx="3" fill="url(#bar2)"/>
  <!-- Bar 3: Teal -->
  <rect x="43" y="14" width="10" height="38" rx="3" fill="url(#bar3)"/>
  
  <!-- Upward Trend Accent Dot -->
  <circle cx="48" cy="9" r="3" fill="#2dd4bf"/>
</svg>
